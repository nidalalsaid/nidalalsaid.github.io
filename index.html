:root{
  --bg:#f4f6f8;
  --panel:#ffffff;
  --text:#1e2a35;
  --muted:#6f8093;

  --teal:#5ca893;
  --teal-dark:#4a8f7c;
  --teal-soft:#e7f3ef;

  --border:#e5eaef;
  --shadow:0 6px 18px rgba(0,0,0,0.05);
  --radius:14px;

  --shadow2:0 6px 16px rgba(0,0,0,0.045);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:"Segoe UI", Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.65;
}

.container{
  max-width:1180px;
  margin:0 auto;
  padding:40px 24px;
}

/* TOP NAV */
.topbar{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.topnav{
  display:flex;
  gap:18px;
  align-items:center;
  flex-wrap:wrap;
}

.topnav a{
  text-decoration:none;
  color:var(--muted);
  font-size:14px;
  font-weight:600;
  padding:6px 2px;
  border-bottom:2px solid transparent;
}

.topnav a:hover{
  color:var(--text);
  border-bottom-color:rgba(92,168,147,0.35);
}

.topnav a.active{
  color:var(--text);
  border-bottom-color:rgba(92,168,147,0.7);
}

.cvbtn{
  display:inline-block;
  padding:10px 16px;
  font-size:14px;
  font-weight:600;
  border-radius:999px;
  background:var(--teal);
  color:#fff;
  text-decoration:none;
  transition:background .2s ease;
}

.cvbtn:hover{
  background:var(--teal-dark);
}

/* HERO */
.hero{
  background:linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(244,246,248,1) 100%);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
  display:grid;
  grid-template-columns:1fr 240px;
  gap:26px;
  align-items:start;
}

.hero h1{
  margin:0;
  font-size:40px;
  font-weight:700;
  letter-spacing:-0.4px;
}

.identity{
  margin-top:10px;
  color:var(--muted);
  font-size:15px;
  line-height:1.65;
  max-width:760px;
}

.hero-badges{
  margin-top:12px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border-radius:999px;
  background:var(--teal-soft);
  border:1px solid #cfe7df;
  color:var(--teal-dark);
  font-weight:700;
  font-size:13px;
}

.pill svg{
  width:16px;
  height:16px;
  fill:var(--teal-dark);
  opacity:.95;
}

.avatar{
  display:flex;
  justify-content:flex-end;
}

.avatar img{
  width:170px;
  height:170px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid var(--teal);
  background:#fff;
}

/* PANELS */
.panel{
  margin-top:22px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:26px;
  box-shadow:var(--shadow);
}

/* SECTION TITLE */
.section-title{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:22px;
  font-weight:700;
  margin:0 0 18px 0;
}

.section-title::before{
  content:"";
  width:4px;
  height:24px;
  border-radius:3px;
  background:var(--teal);
}

/* Professional Profile block */
.profile-wrap{
  display:grid;
  grid-template-columns:1.05fr 1fr;
  gap:18px;
  align-items:stretch;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  box-shadow:var(--shadow2);
}

.card-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.card-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:var(--teal-soft);
  border:1px solid #cfe7df;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}

.card-icon svg{
  width:18px;
  height:18px;
  fill:var(--teal-dark);
}

.card-cap{
  font-size:12px;
  letter-spacing:.14em;
  font-weight:700;
  color:var(--text);
  text-transform:uppercase;
}

.overview-text{
  margin:0;
  color:var(--muted);
  font-size:14px;
}

.checklist{
  margin:12px 0 0;
  padding:0;
  list-style:none;
  display:grid;
  gap:10px;
}

.checklist li{
  display:flex;
  gap:10px;
  align-items:flex-start;
  font-size:14.5px;
  font-weight:600;
  color:var(--text);
}

.tick{
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--teal-soft);
  color:var(--teal-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  margin-top:2px;
  border:1px solid #cfe7df;
}

.tick svg{
  width:13px;
  height:13px;
  fill:var(--teal-dark);
}

.skills-pills{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:8px;
}

.stats{
  margin-top:12px;
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
}

.stat{
  background:linear-gradient(180deg, rgba(92,168,147,.14) 0%, rgba(255,255,255,1) 70%);
  border:1px solid rgba(92,168,147,.22);
  border-radius:14px;
  padding:14px 12px 12px;
  text-align:center;
}

.stat .n{
  font-size:24px;
  font-weight:700;
  letter-spacing:-0.4px;
  color:var(--teal-dark);
  line-height:1;
}

.stat .t{
  margin-top:8px;
  color:var(--muted);
  font-weight:600;
  font-size:12.5px;
  line-height:1.2;
}

/* Academic profiles links */
.profiles{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:0;
}

.profiles a{
  display:inline-block;
  padding:8px 12px;
  border-radius:999px;
  background:var(--teal-soft);
  border:1px solid #cfe7df;
  color:var(--teal-dark);
  text-decoration:none;
  font-weight:700;
  font-size:13px;
}

.profiles a:hover{
  border-color:rgba(92,168,147,0.55);
  color:var(--text);
}

/* BOOK/PUB CARDS */
.items-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.item-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  box-shadow:var(--shadow);
  display:flex;
  gap:16px;
  align-items:flex-start;
}

.cover{
  width:120px;
  height:170px;
  border-radius:10px;
  object-fit:cover;
  border:1px solid var(--border);
  background:#fff;
  flex:none;
}

.item-body h3{
  margin:0;
  font-size:17px;
  font-weight:700;
  line-height:1.28;
  letter-spacing:-0.2px;
}

.meta{
  margin:8px 0 0;
  color:var(--muted);
  font-weight:600;
  font-size:13.5px;
  line-height:1.45;
}

.desc{
  margin:10px 0 0;
  color:var(--muted);
  font-size:13.5px;
  line-height:1.65;
}

.actions{
  margin-top:12px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  display:inline-block;
  padding:8px 14px;
  font-size:13px;
  font-weight:600;
  border-radius:8px;
  background:var(--teal);
  color:#fff;
  text-decoration:none;
  transition:background .2s ease;
}

.btn:hover{
  background:var(--teal-dark);
}

/* IP cards */
.ip-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:18px;
}

.ip-top{
  color:var(--text);
  font-weight:700;
  margin:0 0 8px;
  font-size:13px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.ip-title{
  margin:0;
  font-size:16px;
  font-weight:700;
  line-height:1.28;
}

.ip-meta{
  margin:10px 0 0;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}

.ip-desc{
  margin:10px 0 0;
  color:var(--muted);
  font-size:13.5px;
  line-height:1.65;
}

/* NEWS */
.news{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:16px;
}

.badge{
  display:inline-block;
  background:var(--teal-soft);
  border:1px solid #cfe7df;
  color:var(--teal-dark);
  padding:6px 10px;
  border-radius:999px;
  font-weight:700;
  font-size:12px;
}

.news h3{
  margin:10px 0 0;
  font-size:16px;
  font-weight:700;
  line-height:1.25;
}

.news p{
  margin:8px 0 0;
  color:var(--muted);
  font-size:13.5px;
  line-height:1.65;
}

/* FOOTER */
.footer{
  margin-top:28px;
  text-align:center;
  font-size:13px;
  color:var(--muted);
}

@media (max-width: 980px){
  .hero{ grid-template-columns:1fr; }
  .avatar{ justify-content:flex-start; }
  .profile-wrap{ grid-template-columns:1fr; }
  .items-grid{ grid-template-columns:1fr; }
  .item-card{ flex-direction:column; }
  .cover{ width:100%; height:220px; }
  .stats{ grid-template-columns:1fr; }
}
</style>
